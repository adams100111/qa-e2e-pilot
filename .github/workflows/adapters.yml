name: adapters
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }   # guarantees stdlib tomllib (3.11+) for the TOML checks
      - run: bash scripts/validate-adapters.sh

  qa-kit:
    # Gate the qa-kit plugin (engine byte-oracle above is separate): the qa-kit multi-harness byte-oracle +
    # every qa-kit dual-engine suite. The suite LIST lives in qa-kit/scripts/run-qakit-ci.sh (single source),
    # so adding a suite there enrolls it here automatically — this job never changes. ubuntu-latest ships jq,
    # so each suite exercises both engines; python3 3.12 covers the jq-absent fallback leg.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: qa-kit byte-oracle + all qa-kit suites
        run: bash qa-kit/scripts/run-qakit-ci.sh
