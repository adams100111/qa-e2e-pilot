name: adapters
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }   # guarantees stdlib tomllib (3.11+) for the TOML checks
      - run: bash scripts/validate-adapters.sh

  qa-kit:
    # Gate the qa-kit plugin (engine byte-oracle above is separate): the qa-kit multi-harness byte-oracle +
    # every qa-kit dual-engine suite. The suite LIST lives in qa-kit/scripts/run-qakit-ci.sh (single source),
    # so adding a suite there enrolls it here automatically — this job never changes. ubuntu-latest ships jq,
    # so each suite exercises both engines; python3 3.12 covers the jq-absent fallback leg.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: qa-kit byte-oracle + all qa-kit suites
        run: bash qa-kit/scripts/run-qakit-ci.sh

  suite-coverage:
    # Meta-gate: every tests/<suite>/ dir must be enrolled in exactly one CI list
    # (run-engine-ci.sh or run-qakit-ci.sh). Fails the build if a new suite is added
    # but never enrolled — the silent-omission risk a code review flagged.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: every tests/ suite is gated exactly once
        run: bash scripts/check-suite-coverage.sh

  engine:
    # Gate the ENGINE's self-contained test suites. The suite LIST lives in scripts/run-engine-ci.sh
    # (single source), so enrolling a suite there enrolls it here automatically. Needs node (the
    # human-action gate + session-to-toolstream shell out to node) + jq (ubuntu-latest ships it) +
    # python3 (the jq-absent fallback leg). All 35 self-contained engine suites are enrolled.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: engine self-contained test suites
        run: bash scripts/run-engine-ci.sh

  accuracy:
    # Accuracy-harness gates (spec W4-5). Both legs are headless/deterministic — no browser, no live
    # agent dispatch — so they run on every PR while the real black-box agent run against the fixture
    # (tools/accuracy-harness/README.md's "MEASURED vs ESTIMATED") stays a manual/local step.
    #   (a) UX measured gate: the real detector cores + adjudicator scored against a committed DOM
    #       snapshot (tools/accuracy-harness/fixture-ux/snapshot.json).
    #   (b) Scorer-regression gate: re-scores the committed blind-reference findings file
    #       (findings/measured-blind-v2.json — the "Truly-blind, AFTER coverage fixes" row in the
    #       harness README, 78%/100%/85% recall at 100% precision, GATE PASS) with --gate, so a
    #       scorer/seed regression turns this red even though no new findings were measured.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: UX measured gate (headless, deterministic)
        run: bash tools/accuracy-harness/run-ux-measure.sh
      - name: Scorer-regression gate (committed blind reference)
        run: node tools/accuracy-harness/scorer/score.js tools/accuracy-harness/findings/measured-blind-v2.json --gate
